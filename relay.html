<!doctype html><meta charset="utf-8"><title>relay</title>
<p id="s">loading…</p>
<script>
(async () => {
  const name = new URLSearchParams(location.search).get('f');
  const r = await fetch(name, { cache: 'no-store' });
  const b = await r.blob();
  window.opener && window.opener.postMessage({ laRelay: name, blob: b }, 'https://appstoreconnect.apple.com');
  document.getElementById('s').textContent = 'sent ' + b.size;
  setTimeout(() => window.close(), 500);
})();
</script>
